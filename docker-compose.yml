version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://policydiff:policydiff_secret@postgres:5432/policydiff_db
      - SECRET_KEY=production-secret-key-change-in-deploy
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - policy_uploads:/app/backend/uploads

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: policydiff
      POSTGRES_PASSWORD: policydiff_secret
      POSTGRES_DB: policydiff_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policydiff -d policydiff_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  policy_uploads:
